<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧨</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FireWorks Marketplace — Safe, PESO-Compliant &amp; CSIR-NEERI Certified Green Crackers</title>
    <meta name="description" content="India's leading compliant firecracker platform. Shop Supreme Court certified Green Crackers with authorized depot pickup and zero-oversell safety." />
    <!-- Google Fonts: Noto Sans Tamil (primary) + Outfit (Latin headings) + Inter (Latin body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap&subset=tamil" rel="stylesheet">
    <style>
      /* ── Tamil Glyph Rendering Fix ─────────────────────────────────────────── */
      /* Ensure Tamil Unicode block (U+0B80–U+0BFF) always uses Noto Sans Tamil  */
      @font-face {
        font-family: 'FireWorksTamil';
        src: local('Noto Sans Tamil'), local('NotoSansTamil');
        unicode-range: U+0B80-0BFF; /* Tamil Unicode block */
        font-display: swap;
      }

      html, body, #root {
        /* Tamil-first font stack: Tamil glyphs → Latin heading font → system fallback */
        font-family: 'Noto Sans Tamil', 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-feature-settings: "kern" 1, "liga" 1;
      }

      /* Uniform Tamil text rendering across all elements */
      :lang(ta), [lang="ta"],
      [class*="MuiTypography"],
      [class*="MuiButton"],
      [class*="MuiChip"] {
        font-family: 'Noto Sans Tamil', 'Outfit', 'Inter', sans-serif !important;
        font-feature-settings: "kern" 1;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      /* Prevent Tamil glyphs from being clipped by tight line-heights */
      * {
        box-sizing: border-box;
      }

      /* Fix Tamil vowel marks (மாத்திரை) vertical alignment */
      span, p, h1, h2, h3, h4, h5, h6, button, label, li {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
